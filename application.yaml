apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jazlyn-app
spec:
  project: default
  source:
    repoURL: "https://github.com/jazlyncyt/activity3.13.git"
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: jazlyn-ns
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
